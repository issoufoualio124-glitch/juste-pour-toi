<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUSTE POUR TOI ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 min-height:100vh;
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#160d2b,#351344,#17152f);
 color:white;
}
.container{max-width:600px;margin:auto}
header{text-align:center;padding:35px 5px}
.heart{font-size:55px}
h1{color:#ff9bc9;margin:10px}
.subtitle{color:#d9c4e8}
.card{
 background:#ffffff12;
 border:1px solid #ffffff25;
 border-radius:18px;
 padding:22px;margin:18px 0;
}
h2{color:#ffafd5;font-size:20px}
input,textarea{
 width:100%;padding:14px;margin:9px 0 18px;
 border:1px solid #ffffff30;
 border-radius:10px;
 background:#211631;color:white;
 font-size:16px;
}
label{font-size:14px;color:#eaddec}
button{
 width:100%;border:0;border-radius:10px;
 padding:15px;background:#e65b9b;
 color:white;font-weight:bold;font-size:16px;
 cursor:pointer;
}
.flash{
 background:#493052;padding:13px;
 border-radius:10px;overflow-wrap:anywhere;
}
.footer{text-align:center;color:#d9c4e8;font-size:13px}
</style>
</head>
<body>
<div class="container">

<header>
 <div class="heart">💗</div>
 <h1>JUSTE POUR TOI</h1>
 <p class="subtitle">
 Chaque attention mérite une surprise.
 </p>
</header>

{% with messages = get_flashed_messages() %}
 {% for message in messages %}
 <p class="flash">{{ message }}</p>
 {% endfor %}
{% endwith %}

<div class="card">
 <h2>💌 Créer une surprise</h2>

 <form method="POST" action="/create-surprise">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label>Prénom du destinataire</label>
  <input
   name="surprise_name"
   placeholder="Ex : Amina"
   maxlength="60"
   required
  >

  <label>Ton message secret</label>
  <textarea
   name="surprise_message"
   rows="6"
   placeholder="Écris ton message personnalisé..."
   maxlength="2000"
   required
  ></textarea>

  <label>Texte autour du cœur (facultatif)</label>
  <textarea
   name="orbit_text"
   rows="3"
   placeholder="Ex : Tu es ma plus belle histoire..."
   maxlength="300"
  ></textarea>

  <button type="submit">
   ✨ Générer mon lien surprise
  </button>

 </form>
</div>

<p class="footer">
 JUSTE POUR TOI ❤️ — Créé avec attention.
</p>

</div>
</body>
</html>
